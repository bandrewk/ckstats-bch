packages:
  - '.'

# Project-wide settings
minimumReleaseAge: 10080  # 7 days in minutes

# pnpm 11 no longer reads pnpm.onlyBuiltDependencies from package.json,
# which makes every `pnpm run <script>` fail with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  sharp: true
  unrs-resolver: true

# pnpm 10 reads the same allowance under its older name.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# pnpm 11 no longer reads pnpm.overrides from package.json either. These are
# security floors, so they are restated here to keep them in effect.
overrides:
  lodash: ^4.17.21
  base-x: ^4.0.1
  cross-spawn: ^7.0.5
